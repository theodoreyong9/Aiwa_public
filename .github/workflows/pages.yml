name: Site

# Publishes site/ on GitHub Pages: https://theodoreyong9.github.io/Aiwa_public/
# It runs when the work branch has been promoted into main (a push made by the Promote workflow does not start other workflows, so it is
# started from its end), when site/ changes on main, and by hand.
on:
  workflow_run:
    workflows: [Promote]
    types: [completed]
  push:
    branches: [main]
    paths: [site/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
